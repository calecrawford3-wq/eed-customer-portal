<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Acorn Finance</title>
<style>
*{box-sizing:border-box}body{font:15px system-ui,sans-serif;margin:0;padding:20px 14px;color:#172033;background:#fff;text-align:center}main{max-width:560px;margin:auto}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#64748b;margin:0 0 8px}.amount{font-size:clamp(30px,8vw,42px);font-weight:750;letter-spacing:-.04em;margin:0;line-height:1.2}.note{font-size:13px;line-height:1.55;color:#475569;margin:12px auto;max-width:380px}#status{color:#64748b;font-size:13px;line-height:1.5;margin:14px auto}#widget{border:1px solid #e2e8f0;border-radius:14px;padding:16px 8px;margin:20px auto;background:#fff;max-width:460px}acorn-standard-widget{display:block;margin:0 auto}a{color:#075985}@media(max-width:480px){body{padding:16px 8px}#widget{padding:14px 4px;margin:16px auto}}
</style>
</head>
<body><main><p class="eyebrow">Requested financing</p><p class="amount" id="amount-display"></p><p class="note">Explore financing from Acorn's network of lenders. Actual offers, rates and terms depend on your application.</p><div id="widget"><p id="status" role="status">Loading financing options…</p></div><p class="note">Your application is handled by Acorn and its lending partners. Elite will update your financing status after review.</p></main>
<script>
(() => {
 const q=new URLSearchParams(location.search);
 const amount=Number(q.get("amount")), reference=q.get("reference")||"";
 const status=document.getElementById("status");
 if(!Number.isInteger(amount)||amount<1000||amount>100000||!/^eed-[a-f0-9-]{36}$/.test(reference)){status.textContent="Unable to load this financing quote.";return;}
 document.getElementById("amount-display").textContent=new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0}).format(amount);
 const script=document.createElement("script");
 script.type="module";script.crossOrigin="anonymous";
 script.integrity="sha384-pn2Y+Ywz9biPm5DoE3+NrMJER9NG0OV0bNIwlITbGsj5wlRk8gzDOsPDUI6qFoey";
 script.src="https://widgets-cdn.acornfinance.com/paw/v5/versions/5.7.1/af-standard.min.js";
 script.onerror=()=>{status.textContent="The widget is unavailable. Use the secure application link in the Elite dialog.";};
 const timer=setTimeout(()=>{status.textContent="The widget is taking longer than expected. You can use the secure application link below the widget.";},12000);
 script.onload=async()=>{
  await customElements.whenDefined("acorn-standard-widget");
  const widget=document.createElement("acorn-standard-widget");
  Object.assign(widget,{dealerId:"GLDIK",companyName:"Elite Engine Development",env:"Prod",loanAmount:amount,utm_content:reference,utm_medium:"elite_portal",kind:"popup",popupType:"apply",pageType:"apply",theme:"no-border",alignment:"center",lineOption:"2line",learnHowLabel:"Explore financing",acornCtaStyle:"display:inline-block;padding:12px 18px;background:#c91620;color:#fff;border:0;border-radius:8px;font-weight:700;text-decoration:none;line-height:1.4;",acornCtaHoverStyle:"display:inline-block;padding:12px 18px;background:#a71019;color:#fff;border:0;border-radius:8px;font-weight:700;text-decoration:none;line-height:1.4;",showPromoText:true,showStandardWidget:true,logging:true});
  document.getElementById("widget").append(widget);
  await widget.updateComplete;
  clearTimeout(timer);
  status.textContent="";status.hidden=true;
 };
 document.head.append(script);
})();
</script>
</body></html>
